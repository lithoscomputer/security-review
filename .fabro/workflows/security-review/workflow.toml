_version = 1

[workflow]
graph = "security-review.fabro"

[run]
goal = "Perform an adversarial, read-only security review of this repository and report only panel-verified findings."

[run.inputs]
mode = "scan"
effort = "medium"
# Use neutral model slots A/B/C/D. Set this to false to use the standard
# Sonnet/Opus path. This setting is independent of effort.
ensemble = true
scope = ""
base = ""
commit = ""
range = ""
focus = ""

[run.model]
name = "sonnet"
provider = "openrouter"

[run.model.controls]
reasoning_effort = "low"

[run.environment]
id = "security-review"

[run.environment.network]
mode = "allow_all"

[run.environment.env]
GITHUB_TOKEN = ""
GH_TOKEN = ""

# Fabro gives API workflow agents the full native tool set. The agents are
# instructed to read rather than execute; nothing enforces that, so the
# disposable sandbox is the boundary.
[run.agent]
permissions = "full"

[run.checkpoint]
exclude_globs = [
  "CLAUDE-SECURITY-*/**",
  ".fabro/blobs/**",
  ".fabro/workflows/security-review/runtime",
  ".fabro/workflows/security-review/runtime/**",
]

[run.artifacts]
include = [
  "CLAUDE-SECURITY-*/.gitignore",
  "CLAUDE-SECURITY-*/CLAUDE-SECURITY-RESULTS.md",
  "CLAUDE-SECURITY-*/CLAUDE-SECURITY-RESULTS.jsonl",
  "CLAUDE-SECURITY-*/CLAUDE-SECURITY-FILE-COVERAGE.json",
  "CLAUDE-SECURITY-*/CLAUDE-SECURITY-REVISION-*.json",
]

[environments.security-review]
provider = "daytona"

# The scan's agents search the tree constantly. buildpack-deps:noble, the
# Daytona default base, ships grep but not ripgrep, which respects .gitignore
# and is far faster on a large repository. Installed at image build time
# because the run itself has no network.
[environments.security-review.image]
dockerfile = """
FROM buildpack-deps:noble
RUN apt-get update && apt-get install -y --no-install-recommends ripgrep && rm -rf /var/lib/apt/lists/*
"""

[environments.security-review.resources]
cpu = 2
memory = "4GB"
