_version = 1

[workflow]
graph = "security-review.fabro"

[run]
goal = "Verify the security-review workflow against its deliberate command-injection fixture."

[run.inputs]
mode = "scan"
effort = "low"
scope = ".fabro/workflows/security-review/fixtures/command_injection.py"
base = ""
commit = ""
range = ""
focus = ""

[run.run_branch]
enabled = false

[run.model]
name = "sonnet"
provider = "openrouter"

[run.model.controls]
reasoning_effort = "low"

[run.environment]
id = "security-review"

[run.environment.network]
mode = "allow_all"

[run.environment.env]
GITHUB_TOKEN = ""
GH_TOKEN = ""

[run.agent]
permissions = "full"

[run.checkpoint]
exclude_globs = [
  "CLAUDE-SECURITY-*/**",
  ".fabro/blobs/**",
  ".fabro/workflows/security-review/runtime",
  ".fabro/workflows/security-review/runtime/**",
]

[run.artifacts]
include = [
  ".fabro/workflows/security-review/runtime/**",
  "CLAUDE-SECURITY-*/.gitignore",
  "CLAUDE-SECURITY-*/.claude-security-run/**",
  "CLAUDE-SECURITY-*/scan-manifest.json",
  "CLAUDE-SECURITY-*/candidate-ledger.jsonl",
  "CLAUDE-SECURITY-*/findings.json",
  "CLAUDE-SECURITY-*/coverage.json",
  "CLAUDE-SECURITY-*/panel-votes.jsonl",
  "CLAUDE-SECURITY-*/CLAUDE-SECURITY-RESULTS.md",
  "CLAUDE-SECURITY-*/CLAUDE-SECURITY-RESULTS.jsonl",
  "CLAUDE-SECURITY-*/CLAUDE-SECURITY-REVISION-*.json",
]

[environments.security-review]
provider = "daytona"

# The scan's agents search the tree constantly. buildpack-deps:noble, the
# Daytona default base, ships grep but not ripgrep, which respects .gitignore
# and is far faster on a large repository. Installed at image build time
# because the run itself has no network.
[environments.security-review.image]
dockerfile = """
FROM buildpack-deps:noble
RUN apt-get update && apt-get install -y --no-install-recommends ripgrep && rm -rf /var/lib/apt/lists/*
"""

[environments.security-review.resources]
cpu = 2
memory = "4GB"
